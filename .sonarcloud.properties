# Configuración del análisis automático de SonarQube Cloud
# (el análisis automático lee este archivo, no sonar-project.properties)

# Código de producción
sonar.sources=certivalidate-backend/src,certivalidate-backend/prisma/seed.js,certivalidate-backend/scripts,academic-api/src,academic-api/prisma/seed.js,certivalidate-frontend/src,blockchaincontracts

# Código de prueba: se analiza con las reglas de pruebas, no con las de producción
sonar.tests=certivalidate-backend/tests,certivalidate-frontend/src/__tests__,academic-api/tests,pruebas_aceptacion

# certivalidate-frontend/src/__tests__ está dentro de sonar.sources: se excluye de producción
sonar.exclusions=**/node_modules/**,**/migrations/**,**/dist/**,**/build/**,**/__tests__/**,**/*.test.js,**/*.test.jsx,**/setupTests.js

# Las pruebas de aceptación (Selenium + pytest) usan Python 3.11
sonar.python.version=3.11
